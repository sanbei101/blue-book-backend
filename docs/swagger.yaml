components:
  schemas:
    api.apiKeyResponse:
      properties:
        created_at:
          type: string
        id:
          type: string
        key_prefix:
          type: string
        last_used_at:
          type: string
        name:
          type: string
        revoked_at:
          type: string
      required:
      - created_at
      - id
      - key_prefix
      - name
      type: object
    api.authResponse:
      properties:
        access_token:
          description: Access token
          type: string
        expires_in:
          description: Access token 有效期,单位为秒
          minimum: 0
          type: integer
        refresh_token:
          description: Refresh token
          type: string
        user:
          $ref: '#/components/schemas/api.userResponse'
      required:
      - access_token
      - expires_in
      - refresh_token
      - user
      type: object
    api.authorResponse:
      description: 作者信息
      properties:
        avatar_url:
          description: 头像地址
          type: string
        id:
          description: 用户 ID
          type: string
        username:
          description: 用户名
          type: string
        viewer_following:
          description: 当前用户是否已关注作者
          type: boolean
      required:
      - avatar_url
      - id
      - username
      - viewer_following
      type: object
    api.changePasswordRequest:
      properties:
        new_password:
          description: 新密码
          maxLength: 128
          minLength: 6
          type: string
        old_password:
          description: 当前密码
          type: string
      required:
      - new_password
      - old_password
      type: object
    api.collectPostRequest:
      properties:
        folder_id:
          description: 收藏夹 ID,可选
          type: string
      type: object
    api.collectionStatusResponse:
      properties:
        collect_count:
          description: 收藏数量
          minimum: 0
          type: integer
        viewer_collected:
          description: 是否已收藏
          type: boolean
      required:
      - collect_count
      - viewer_collected
      type: object
    api.commentResponse:
      properties:
        author_avatar:
          description: 作者头像地址
          type: string
        author_username:
          description: 作者用户名
          type: string
        content:
          description: 评论内容
          type: string
        created_at:
          description: 创建时间
          type: string
        id:
          description: 评论 ID
          type: string
        like_count:
          description: 点赞数
          minimum: 0
          type: integer
        parent_id:
          description: 父评论 ID,顶级评论为 nil
          type: string
        post_id:
          description: 帖子 ID
          type: string
        user_id:
          description: 用户 ID
          type: string
        viewer_liked:
          description: 当前用户是否已点赞
          type: boolean
      required:
      - author_avatar
      - author_username
      - content
      - created_at
      - id
      - like_count
      - post_id
      - user_id
      - viewer_liked
      type: object
    api.createAPIKeyRequest:
      properties:
        name:
          description: Key name shown in account settings.
          maxLength: 100
          type: string
      required:
      - name
      type: object
    api.createAPIKeyResponse:
      properties:
        created_at:
          type: string
        id:
          type: string
        key:
          type: string
        key_prefix:
          type: string
        name:
          type: string
      required:
      - created_at
      - id
      - key
      - key_prefix
      - name
      type: object
    api.createCommentRequest:
      properties:
        content:
          description: 评论内容
          maxLength: 1000
          type: string
        parent_id:
          description: 父评论 ID,如果是顶级评论则为 nil
          type: string
        post_id:
          description: 帖子唯一标识 ID
          type: string
      required:
      - content
      - post_id
      type: object
    api.createFolderRequest:
      properties:
        name:
          description: 收藏夹名称
          maxLength: 50
          type: string
      required:
      - name
      type: object
    api.createMediaItem:
      properties:
        media_key:
          description: 媒体对象 key
          type: string
        media_type:
          description: 媒体类型 (image/video)
          enum:
          - image
          - video
          type: string
        sort_order:
          description: 排序序号
          type: integer
      required:
      - media_key
      - media_type
      type: object
    api.createPostRequest:
      properties:
        content:
          description: 帖子内容
          type: string
        media:
          description: 媒体列表
          items:
            $ref: '#/components/schemas/api.createMediaItem'
          type: array
          uniqueItems: false
        tags:
          description: 标签名称
          items:
            type: string
          type: array
          uniqueItems: false
        title:
          description: 帖子标题
          maxLength: 100
          type: string
      required:
      - content
      - title
      type: object
    api.createPostResponse:
      properties:
        id:
          description: 帖子 ID
          type: string
      required:
      - id
      type: object
    api.createTagRequest:
      properties:
        description:
          description: 标签描述
          maxLength: 200
          type: string
        name:
          description: 标签名称
          maxLength: 50
          type: string
      required:
      - name
      type: object
    api.cursorPageResponse-api_listPostsItemResponse:
      properties:
        has_more:
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/api.listPostsItemResponse'
          type: array
          uniqueItems: false
        next_cursor:
          type: string
      required:
      - has_more
      - items
      type: object
    api.deleteCommentResponse:
      properties:
        comment_count:
          minimum: 0
          type: integer
        id:
          type: string
        post_id:
          type: string
      required:
      - comment_count
      - id
      - post_id
      type: object
    api.folderResponse:
      properties:
        created_at:
          description: 创建时间
          type: string
        id:
          description: 收藏夹 ID
          type: string
        name:
          description: 收藏夹名称
          type: string
      required:
      - created_at
      - id
      - name
      type: object
    api.followStatusResponse:
      properties:
        follower_count:
          description: 该用户粉丝数
          minimum: 0
          type: integer
        viewer_following:
          description: 是否已关注
          type: boolean
      required:
      - follower_count
      - viewer_following
      type: object
    api.followUserResponse:
      properties:
        avatar_url:
          description: 头像地址
          type: string
        bio:
          description: 个人简介
          type: string
        id:
          description: 用户 ID
          type: string
        username:
          description: 用户名
          type: string
        viewer_following:
