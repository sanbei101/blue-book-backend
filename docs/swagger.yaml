        content:
          description: 内容
          type: string
        created_at:
          description: 创建时间
          type: string
        id:
          description: 帖子 ID
          type: string
        like_count:
          description: 点赞数
          minimum: 0
          type: integer
        media:
          description: 媒体列表
          items:
